# GeneralsX @build rpi5 12/10/2026
# Build the Raspberry Pi 5 package of Zero Hour (game + Mesa V3DV driver) on an arm64 runner.
# Pushes to the Pi branch upload the package as a workflow artifact. Pushing a tag named
# pi5-* also publishes it, with the installer, as a GitHub release.
name: Build Pi 5

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'rpi5/**'
    tags:
      - 'pi5-*'
    paths-ignore:
      - 'docs/**'

concurrency:
  group: build-pi5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zero Hour (Pi 5, aarch64)
    runs-on: ubuntu-24.04-arm
    # Build on bookworm so the binaries also run on bookworm's older glibc.
    container: debian:bookworm
    timeout-minutes: 360
    env:
      VCPKG_ROOT: /opt/vcpkg
      MESA_VER: 26.2.4
      MESA_PREFIX: /opt/mesa-26.2.4
    steps:
      - name: Install git and sudo
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git sudo ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: |
            /opt/vcpkg
            /github/home/.cache/vcpkg/archives
          key: vcpkg-pi5-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: |
            vcpkg-pi5-

      - name: Cache Mesa
        id: cache-mesa
        uses: actions/cache@v5
        with:
          path: ${{ env.MESA_PREFIX }}
          key: mesa-pi5-${{ env.MESA_VER }}-${{ hashFiles('scripts/build/linux/build-pi5-mesa.sh') }}

      - name: Build Mesa V3DV
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: PREFIX="${MESA_PREFIX}" ./scripts/build/linux/build-pi5-mesa.sh

      - name: Build Zero Hour
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ./scripts/build/linux/build-pi5-zh.sh

      - name: Package
        run: |
          # The Mesa cache restores without its build dependencies; patchelf is needed by deploy.
          sudo apt-get install -y -qq patchelf
          ./scripts/build/linux/bundle-pi5-zh.sh
          cp scripts/build/linux/install-pi5-zh.sh .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-pi5-aarch64
          path: |
            GeneralsXZH-pi5-aarch64.tar.gz
            install-pi5-zh.sh
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/pi5-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: GeneralsXZH-pi5-aarch64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zero Hour for Raspberry Pi 5 (${GITHUB_REF_NAME})" \
            --notes "Install on a Raspberry Pi 5 (64-bit OS) with:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-pi5-zh.sh | bash
          \`\`\`

          You need your own copy of Generals and Zero Hour. See README-PI5.txt in the package." \
            GeneralsXZH-pi5-aarch64.tar.gz install-pi5-zh.sh
