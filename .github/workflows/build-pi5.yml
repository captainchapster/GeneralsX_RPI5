# GeneralsX @build rpi5 12/10/2026
# Build the Raspberry Pi 5 package of Zero Hour (game + Mesa V3DV driver) on an arm64 runner.
# Pushes to the Pi branch upload the package as a workflow artifact. Pushing a tag named
# pi5-* also publishes it, with the installer, as a GitHub release, as does running the workflow by
# hand with a release tag (the release then creates the tag).
name: Build Pi 5

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (pi5-...); leave empty to only build'
        required: false
        default: ''
  push:
    branches:
      - 'rpi5/**'
    tags:
      - 'pi5-*'
    paths-ignore:
      - 'docs/**'

concurrency:
  group: build-pi5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zero Hour (Pi 5, aarch64)
    runs-on: ubuntu-24.04-arm
    # Build on bookworm so the binaries also run on bookworm's older glibc.
    container: debian:bookworm
    timeout-minutes: 360
    env:
      VCPKG_ROOT: /opt/vcpkg
      MESA_VER: 26.2.4
      MESA_PREFIX: /opt/mesa-26.2.4
    steps:
      - name: Install git and sudo
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git sudo ca-certificates curl

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Restore and save separately so a later failure still keeps the slow vcpkg builds.
      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            /opt/vcpkg
            /github/home/.cache/vcpkg/archives
          key: vcpkg-pi5-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}
          restore-keys: |
            vcpkg-pi5-

      - name: Cache Mesa
        id: cache-mesa
        uses: actions/cache@v5
        with:
          path: ${{ env.MESA_PREFIX }}
          key: mesa-pi5-${{ env.MESA_VER }}-${{ hashFiles('scripts/build/linux/build-pi5-mesa.sh') }}

      - name: Build Mesa V3DV
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: PREFIX="${MESA_PREFIX}" ./scripts/build/linux/build-pi5-mesa.sh

      - name: Build Zero Hour
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ./scripts/build/linux/build-pi5-zh.sh 2>&1 | tee build-pi5.log

      # The job log only keeps the end of a long build, where the DXVK output usually is.
      # Show the first failed build steps so the real error is visible.
      - name: Show build errors
        if: failure()
        shell: bash
        run: grep -n -m 10 -A 30 -E 'FAILED:|error:|Error ' build-pi5.log || tail -n 200 build-pi5.log

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /opt/vcpkg
            /github/home/.cache/vcpkg/archives
          key: vcpkg-pi5-${{ hashFiles('vcpkg.json', 'vcpkg-lock.json') }}

      - name: Package
        run: |
          # The Mesa cache restores without its build dependencies; patchelf is needed by deploy.
          sudo apt-get install -y -qq patchelf
          ./scripts/build/linux/bundle-pi5-zh.sh
          cp scripts/build/linux/install-pi5-zh.sh .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-pi5-aarch64
          path: |
            GeneralsXZH-pi5-aarch64.tar.gz
            install-pi5-zh.sh
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/pi5-') || startsWith(inputs.release_tag, 'pi5-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: GeneralsXZH-pi5-aarch64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Zero Hour for Raspberry Pi 5 (${RELEASE_TAG})" \
            --notes "Command & Conquer Generals Zero Hour for the Raspberry Pi 5 (64-bit OS). You need your own copy of Generals and Zero Hour.

          1. Download GeneralsXZH-pi5-aarch64.tar.gz below.
          2. Extract the GeneralsXZH-pi5 folder and double-click Setup in it.

          Or from a terminal:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-pi5-zh.sh | bash
          \`\`\`

          See README.txt in the package for help. This is an unofficial build: please report problems on this fork, not to GeneralsX." \
            GeneralsXZH-pi5-aarch64.tar.gz install-pi5-zh.sh
